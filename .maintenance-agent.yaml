# maintenance-agent target config. The agent runs nightly from its own clone,
# which `setup` gives a no-mistakes gate of its own; delivery goes through that
# gate (review, test, lint, push, PR, CI), whose commands are .no-mistakes.yaml's.
# Whether an agent PR may merge itself is decided on the host, not here.
version: 1
base_branch: main
delivery: no-mistakes # github | no-mistakes | push-only
diff_limit: 200
churn_paths: [src, scripts, bin, test]
# What defines the gates, and so what a green run means: an agent that could edit
# these could pass its own work by loosening the check instead of the code.
# package.json is here because the coverage floors live in its scripts; the price
# is that dependency bumps and new scripts are a human's job.
protected_paths:
  - .github
  - eslint.config.js
  - stylelint.config.mjs
  - tsconfig*.json
  - .prettierrc
  - .prettierignore
  - .jscpd.json
  - .dependency-cruiser.mjs
  - .no-mistakes.yaml
  - .githooks
  - .maintenance-agent.yaml
  - SECURITY.md
  - package.json
setup: no-mistakes init && pnpm install --frozen-lockfile
# The checks CI runs (.github/workflows/ci.yml), one gate each so a failure names
# its check. Not CI's `pnpm audit`: an advisory published overnight against a
# dependency would block every unrelated agent change until a human upgrades it.
gates:
  - name: test
    run: pnpm test:coverage
  - name: typecheck
    run: pnpm typecheck
  - name: lint
    run: pnpm lint
  - name: css
    run: pnpm lint:css
  - name: format
    run: pnpm format:check
  - name: skill
    run: pnpm build:skill --check
  - name: duplication
    run: pnpm dup
  - name: architecture
    run: pnpm arch
# Analyzer tooling is fetched on demand or already a devDependency: an absolute
# path into one machine's tool directory is an analyzer nobody else can run.
# eslint's `unix` formatter left core in v9, so awk carries the file name over
# from stylish's header line rather than adding a dependency for one report.
analyzers:
  - name: near-limit-functions
    # Folded, because the awk prints `file: line` and a bare `: ` would make YAML
    # read the rest of the command as a nested mapping.
    run: >-
      ./node_modules/.bin/eslint --no-inline-config --rule
      '{"complexity":["warn",4],"max-lines-per-function":["warn",{"max":39,"skipBlankLines":true,"skipComments":true}]}'
      'src/**/*.ts' 'scripts/**/*.ts' | awk '/^\//{file=$0} /complexity of [5-9]|complexity
      of [0-9][0-9]|too many lines/{print file": "$0}'
    note: "repo gates are CC<=7 and 60 lines; these functions are within one step of the limit — early decay warning"
  - name: duplication
    # Same paths and token floor as the `duplication` gate (.jscpd.json); this
    # lists each clone, where the gate only fails past the 1% threshold.
    run: ./node_modules/.bin/jscpd --no-colors | grep -E 'Clone found|^ - |^   [^ ]|^Found [0-9]+ clones'
    note: "clones that must stay in sync are latent divergence bugs"
  - name: possibly-dead-exports
    run: npx -y knip --no-exit-code --reporter compact
    note: "CAUTION - exported types and entry points may be intentional API; verify each before deleting"
  - name: coverage-weak-spots
    run: node --experimental-test-coverage --test 'test/**/*.test.ts' 2>/dev/null | grep -E '^# .*\.(ts|js|css).*\|' | awk -F'|' '{v=$2; gsub(/ /,"",v); if (v+0 < 95) print}'
    note: "files under 95% line coverage (basenames from coverage tree - resolve full path; files never imported by tests are absent entirely)"
