name: Require no-mistakes

# Every change to main is raised through the no-mistakes pipeline, which writes a
# signature and a head-bound attestation into the PR body. This check verifies
# that attestation. A contributor guardrail, not a forgery-proof boundary: the
# attestation is plain text an author can edit. See CONTRIBUTING.md.
on:
  # Not pull_request_target: the action never checks out or runs PR code and
  # needs no write token, so fork PRs get the read-only one.
  pull_request:
    # edited judges a rewritten body; synchronize judges a new head, which the
    # pipeline attests before it pushes (upstream #994, in v1.79.0).
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  # The action reads the PR's live body and head SHA rather than the cached
  # event payload a job rerun replays; without this it fails closed.
  pull-requests: read

# A concurrency group keeps at most one pending run and replaces older pending
# ones even without cancel-in-progress, so body-bearing events (opened, edited)
# each get their own group and can never collapse into one another.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    # Branch rulesets match this exact name; renaming it silently drops the
    # required check.
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # Only automation that cannot go through the pipeline is exempt. It sits at
    # job level, not in the action's exempt-authors input, because a
    # GITHUB_TOKEN PR's run is created in action_required and never starts, so
    # an in-job exemption would never be reached.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
      # Pinned to a full commit SHA, never @main: a ref this repository does not
      # control could change what the required check certifies. v1.79.0 is the
      # no-mistakes version contributors run, so both sides agree on the format.
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@fc540aca86bd1ab35daad31c2a2fb20b652f82ab # v1.79.0
