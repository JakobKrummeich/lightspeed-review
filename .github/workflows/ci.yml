name: CI

# Pushes to main and every pull request; a PR branch is not also run as a push,
# which would report each Dependabot PR twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from package.json's `packageManager`; naming it here
      # too makes the action refuse to pick between the two.
      - uses: pnpm/action-setup@v6

      # `engines` says >= 22.19; 22 is the version the suite is developed on and
      # the one `node --test` runs TypeScript directly under.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint

      # The whole suite, failing below the coverage floors in package.json's
      # `test:coverage` — set a point under what the suite covered when they were
      # introduced: a change that drops coverage noticeably fails, and lowering a
      # floor is an edit a reviewer sees.
      - run: pnpm run test:coverage
      - run: pnpm run format:check

      # The checked-in skill is a build artifact of the CLI's own help strings.
      # A stale one ships guidance the CLI no longer prints, and nothing else in
      # the gate would notice.
      - run: pnpm run build:skill --check

      # Fails past 1% duplicated lines in src/, scripts/ and bin/ (.jscpd.json).
      - run: pnpm run dup

      # Runtime dependencies only: dev tooling never ships to a user. High and
      # critical only, so a moderate advisory with no upgrade yet cannot hold
      # every PR hostage. CI-only, not a maintenance-agent gate — see
      # .maintenance-agent.yaml.
      - run: pnpm audit --prod --audit-level=high
