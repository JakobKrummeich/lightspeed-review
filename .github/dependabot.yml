# Two of the six runtime dependencies are pinned or pre-1.0 (pi-ai exactly,
# axi-sdk-js at 0.x), so nothing but a bot would notice when they move.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch bumps travel together; a major arrives alone, so one
    # breaking release cannot hold the other ten hostage in a red PR.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint refuses TypeScript 7; lift this when it stops refusing.
      - dependency-name: typescript
        versions: [">=7"]
      # Node's types follow the Node the suite runs on (engines >= 22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
